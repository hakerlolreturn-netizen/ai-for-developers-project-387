name: claude-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      github.event.issue.user.type != 'Bot' &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /triage Preliminary triage of new issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Read the issue with gh, check what the calendar app already does (code, GLOSSARY.md, docs/adr/),
            and post one comment in the issue language: what the request is about, what already exists,
            and the questions that block a decision. Apply one category label (bug or enhancement)
            and one state label per docs/agents/triage-labels.md: needs-info if questions remain, otherwise needs-triage.
            Do not change code, create branches or open pull requests. Do not move the issue to ready-for-agent or ready-for-human:
            that is the maintainer's decision.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh label list:*)"
