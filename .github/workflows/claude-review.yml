name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  limit:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAX_RUNS: 5
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_CREATED: ${{ github.event.pull_request.created_at }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Count previous review runs for this PR
        run: |
          previous=$(gh api --paginate \
            "repos/$GH_REPO/actions/workflows/claude-review.yml/runs?event=pull_request&branch=$HEAD_REF&per_page=100" \
            --jq ".workflow_runs[]
              | select(.id != ${{ github.run_id }} and .conclusion != \"skipped\")
              | select(.created_at >= \"$PR_CREATED\")
              | .id" | wc -l)
          echo "Previous runs: $previous, limit: $MAX_RUNS"
          if [ "$previous" -ge "$MAX_RUNS" ]; then
            reason="Авторевью не запущено: исчерпан лимит запусков на PR ($previous из $MAX_RUNS)."
            gh pr comment "$PR" --body "$reason
          HEAD SHA: \`$HEAD_SHA\`
          Лог: $RUN_URL
          Этот head проверяет человек."
            echo "::error::$reason HEAD SHA: $HEAD_SHA"
            exit 1
          fi

  review:
    needs: limit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You are an independent reviewer of this pull request. You did not write this code.
            Read REVIEW.md and follow it: criteria, review depth, finding format, re-review rules.
            Read the pull request with gh pr view and gh pr diff, then read every issue linked in its body
            (request, spec, tickets, approval comment) with gh issue view <n> --json title,body,comments, and compare the change with the spec.
            The PR head is checked out in the working directory. Read every changed file in full with Read, not only the diff hunks,
            and use Grep and Glob to follow the code it calls and the code that calls it.
            For each user story and acceptance criterion in the spec, find the code that implements it and look for inputs, state
            or a sequence of user actions under which it fails. Report it as a defect only if the scenario follows from the code.
            On a re-review, read earlier review comments and replies with gh api and do not repeat resolved ones.
            Post each confirmed defect as an inline comment on the changed line.
            Then post one summary comment with gh pr comment, in Russian: the reviewed HEAD SHA, whether the change matches the spec,
            and the list of findings, or a plain statement that there are no confirmed defects.
            Do not change code, push commits or approve the pull request.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "Read(./**),Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh api:*)"

      - if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-review-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
