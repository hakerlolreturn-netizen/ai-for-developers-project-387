name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You are an independent reviewer of this pull request. You did not write this code.
            Read REVIEW.md and follow it: criteria, review depth, finding format, re-review rules.
            Read the pull request with gh pr view and gh pr diff, then read every issue linked in its body
            (request, spec, tickets, approval comment) with gh issue view, and compare the change with the spec.
            On a re-review, read earlier review comments and replies with gh api and do not repeat resolved ones.
            Post each confirmed defect as an inline comment on the changed line.
            Then post one summary comment with gh pr comment, in Russian: the reviewed HEAD SHA, whether the change matches the spec,
            and the list of findings, or a plain statement that there are no confirmed defects.
            Do not change code, push commits or approve the pull request.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh api:*)"
